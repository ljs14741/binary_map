<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이름궁합 테스트 - 친구 동네가 칠해지는 단짝지도</title>
  <meta name="description" content="두 이름만 접어보는 이름궁합. 링크를 보내면 친구가 사는 도가 내 한국 지도에 칠해져요.">
  <meta name="keywords" content="이름궁합, 이름 궁합 테스트, 단짝지도, 획수 궁합, 친구 궁합">
  <meta name="robots" content="index, follow">
  <meta name="author" content="Binary World">

  <meta property="og:type" content="website">
  <meta property="og:title" content="이름궁합 테스트 - 단짝지도">
  <meta property="og:description" content="두 이름만 접어보는 이름궁합. 링크를 보내면 친구가 사는 도가 지도에 칠해져요.">
  <meta property="og:url" content="https://map.binaryworld.kr">

  <meta name="theme-color" content="#f6f1e8">
  <link rel="stylesheet" href="https://binaryworld.kr/common/header.css">
  <link rel="stylesheet" href="https://binaryworld.kr/common/footer.css">
  <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<header id="global-header" aria-label="Binary World 공통 메뉴"></header>

<main class="map-home">
  <p class="map-brand">단짝지도</p>
  <h1>내 주변에 단짝이 몇 명일까?</h1>
  <p class="map-lead">
    두 이름만 접어보는 이름궁합.<br>
    링크를 보내면 친구가 사는 도가 내 한국 지도에 칠해져요.
  </p>

  <section class="map-card" aria-label="이름궁합">
    <h2>이름 접어보기</h2>
    <form class="map-form" onsubmit="return false;">
      <label>
        내 이름
        <input type="text" name="hostName" maxlength="20" placeholder="이진수" autocomplete="name">
      </label>
      <label>
        상대 이름
        <input type="text" name="guestName" maxlength="20" placeholder="홍길동" autocomplete="off">
      </label>
      <button type="submit" disabled>곧 열어요</button>
    </form>
    <p class="map-note">이름 궁합과 인맥지도는 지금부터 만듭니다. 설계는 DESIGN.md를 보세요.</p>
  </section>
</main>

<footer id="global-footer" aria-label="Binary World 푸터"></footer>
<script src="https://binaryworld.kr/common/header.js" defer></script>
<script src="https://binaryworld.kr/common/footer.js" defer></script>
</body>
</html>
